<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<style>
  :root {
    color-scheme: dark light;
    --bg: #14161a; --panel: #23272e; --text: #eceef1; --dim: #9aa1ab; --line: #2c3038; --mine: #2f6fed; --mine-text: #fff;
    --idle: #6b7280; --listen: #34d399; --work: #fbbf24; --speak: #60a5fa; --bad: #f87171;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #e9ebef; --text: #16181d; --dim: #5b6470; --line: #dfe2e7; --mine: #1d5fd8; --mine-text: #fff;
      --idle: #6b7280; --listen: #047857; --work: #b45309; --speak: #1d4ed8; --bad: #b91c1c;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; background: var(--bg); color: var(--text);
    font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
  }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  #dot { width: 12px; height: 12px; border-radius: 50%; background: var(--idle); flex: none; }
  #state { font-size: 15px; font-weight: 600; }
  #detail { margin-left: auto; color: var(--dim); font-size: 12px; text-align: right; }
  body[data-mood=listen] #dot { background: var(--listen); animation: pulse 1.2s ease-in-out infinite; }
  body[data-mood=work] #dot { background: var(--work); animation: pulse 1.2s ease-in-out infinite; }
  body[data-mood=speak] #dot { background: var(--speak); animation: pulse .6s ease-in-out infinite; }
  body[data-mood=bad] #dot { background: var(--bad); }
  @keyframes pulse { 50% { opacity: .35; } }
  #mic, #quiet { padding: 5px 16px; font-size: 12px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  #mic { color: var(--dim); }
  #quiet { color: var(--work); }
  #mic:empty, #quiet:empty { display: none; }
  #wrap { flex: 1; position: relative; min-height: 0; }
  #chat { height: 100%; overflow-y: auto; padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 6px; }
  #chat:empty::before { content: "Say \201CHey Jarvis\201D"; margin: auto; color: var(--dim); }
  .msg { max-width: 84%; padding: 8px 12px; border-radius: 16px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .you { align-self: flex-end; background: var(--mine); color: var(--mine-text); border-bottom-right-radius: 5px; }
  .me { align-self: flex-start; background: var(--panel); border-bottom-left-radius: 5px; }
  .hello { padding: 4px 11px; color: var(--dim); font-size: 13px; }
  .draft { opacity: .65; }
  .note { align-self: center; max-width: 94%; color: var(--dim); font-size: 12px; text-align: center; overflow-wrap: anywhere; }
  .fail { color: var(--bad); }
  .time { align-self: center; color: var(--dim); font-size: 11px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .dots { display: inline-flex; gap: 4px; padding: 3px 0; vertical-align: middle; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .3; animation: dot 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; }
  .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes dot { 30% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    #dot, .dots i { animation: none !important; }
    .dots i { opacity: .7; }
  }
  #newest {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); padding: 5px 12px; border: 1px solid var(--line);
    border-radius: 14px; background: var(--panel); color: var(--text); font: inherit; font-size: 12px; cursor: pointer;
  }
  #newest[hidden] { display: none; }
  #gear { padding: 2px 8px; border: 1px solid var(--line); border-radius: 8px; background: none; color: var(--dim); font: inherit; font-size: 12px; cursor: pointer; }
  #detail { min-width: 0; }
  #panel { position: absolute; inset: 0; overflow-y: auto; padding: 12px 16px; background: var(--bg); }
  #panel[hidden] { display: none; }
  .set { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .set span { flex: 1; min-width: 0; }
  .set b { display: block; font-weight: 600; }
  .set small { display: block; color: var(--dim); font-size: 12px; }
  .set input[type=checkbox] { width: 18px; height: 18px; flex: none; }
  .set input[type=number] { width: 64px; padding: 3px 6px; flex: none; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  #saved { min-height: 20px; padding-top: 8px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body data-mood="idle">
<header>
  <span id="dot" aria-hidden="true"></span>
  <span id="state" role="status">Connecting</span>
  <span id="detail"></span>
  <button id="gear" type="button" aria-expanded="false">Settings</button>
</header>
<div id="mic"></div>
<div id="quiet"></div>
<div id="wrap">
  <div id="chat" role="log" aria-live="polite"></div>
  <button id="newest" type="button" hidden>Newest</button>
  <div id="panel" hidden></div>
</div>
<script>
  const $ = id => document.getElementById(id)
  const body = document.body, chat = $('chat'), newest = $('newest')
  const WAITING = 'Waiting for "Hey Jarvis"'
  const GAP = 5 * 60_000  // a time between messages further apart than this
  let on = true, lastAt = 0, stuck = true  // stuck: following the newest message; off once they scroll up to read

  function state(mood, words, detail = '') {
    body.dataset.mood = mood
    $('state').textContent = words
    $('detail').textContent = detail
  }
  const rest = (detail = '') => state('idle', on ? WAITING : 'Mic off', detail)

  function follow() {
    if (stuck) chat.scrollTop = chat.scrollHeight
    else newest.hidden = false
  }
  chat.addEventListener('scroll', () => {
    stuck = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 60
    if (stuck) newest.hidden = true
  })
  newest.onclick = () => {
    stuck = true
    newest.hidden = true
    follow()
  }

  // What's in progress stays last in the chat: their words as they come, and the dots while it works.
  const draft = document.createElement('div'), dots = document.createElement('div')
  draft.className = 'msg you draft'
  dots.className = 'msg me'
  const dotsHtml = () => {
    const d = document.createElement('span')
    d.className = 'dots'
    d.setAttribute('aria-label', 'Working')
    d.append(...[0, 1, 2].map(() => document.createElement('i')))
    return d
  }
  dots.append(dotsHtml())
  const hide = el => el.remove()
  function show(el) {
    chat.append(el)
    follow()
  }
  function listening() {  // no words yet
    draft.replaceChildren(dotsHtml())
    show(draft)
  }
  function liveWords(text) {
    draft.textContent = text
    show(draft)
  }

  function add(cls, text, at = Date.now(), raw = '') {
    if (at - lastAt > GAP) {
      const t = document.createElement('div')
      t.className = 'time'
      t.textContent = new Date(at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
      chat.insertBefore(t, chat.contains(draft) ? draft : chat.contains(dots) ? dots : null)
    }
    lastAt = at
    const m = document.createElement('div')
    m.className = cls
    m.textContent = text
    if (raw && raw !== text) m.title = `Heard as: ${raw}`
    chat.insertBefore(m, chat.contains(draft) ? draft : chat.contains(dots) ? dots : null)
    while (chat.children.length > 200) chat.firstChild.remove()
    follow()
  }

  const HANDLERS = {
    state: e => {
      on = e.on
      rest()
      $('mic').textContent = on ? `Mic: ${e.mic || 'name unknown'}` : 'Mic: none open'
    },
    wake: () => { hide(dots); listening(); state('listen', 'Listening') },
    greeting: e => add('msg me hello', e.text, e.at),
    reminder: e => add('msg me', e.text, e.at),
    partial: e => liveWords(e.text),
    heard: e => {
      hide(draft)
      add('msg you', e.text, e.at, e.raw)
      show(dots)
      state('work', 'Thinking')
    },
    nothing: () => { hide(draft); hide(dots); rest('Heard no request') },
    route: e => $('detail').textContent = `${e.kind}, ${e.ms} ms`,
    sent: e => {
      if (e.via !== 'mic') add('msg you', e.text, e.at)
      show(dots)
      state('work', 'Claude is working')
    },
    reply: e => { hide(dots); add('msg me', e.text, e.at) },
    said: () => state('speak', 'Speaking'),
    spoken: e => {
      if (e.listening) {
        listening()
        state('listen', 'Listening for your answer')
      } else rest()
    },
    held: e => add('note', `Held for after your call: ${e.text}`, e.at),
    queued: () => $('detail').textContent = 'A line is waiting for you to finish',
    peak: e => { if (e.score < 0.5) $('detail').textContent = `Last try ${e.score}` },
    status: e => { if (/^Voice:|^Using |now on /.test(e.text)) add('note', e.text, e.at) },
    caption: e => add('note', e.text, e.at),
    quiet: e => $('quiet').textContent = e.on ? `Staying quiet: ${e.text}. Lines wait, and the wake word must be clear.` : '',
    error: e => add('note fail', e.message, e.at),
  }

  // Settings: every change is saved and applied by the voice at once.
  async function saveSetting(key, value) {
    const r = await fetch('/settings', { method: 'POST', body: JSON.stringify({ key, value }) }).catch(() => null)
    $('saved').textContent = r?.ok ? 'Saved. It applies now.' : "Couldn't save that."
    return r?.ok
  }
  async function openSettings() {
    const list = await (await fetch('/settings')).json()
    const panel = $('panel')
    panel.replaceChildren(...list.map(s => {
      const row = document.createElement('label'), words = document.createElement('span')
      const name = document.createElement('b'), hint = document.createElement('small'), input = document.createElement('input')
      row.className = 'set'
      name.textContent = s.label
      hint.textContent = s.hint
      words.append(name, hint)
      if (s.options) {
        input.type = 'checkbox'
        input.checked = s.value === s.options[0]
        input.onchange = async () => {
          if (!await saveSetting(s.key, input.checked ? s.options[0] : s.options[1])) input.checked = !input.checked
        }
      } else {
        input.type = 'number'
        Object.assign(input, { min: s.min, max: s.max, value: s.value })
        input.onchange = () => saveSetting(s.key, input.value)
      }
      row.append(words, input)
      return row
    }))
    const saved = document.createElement('div')
    saved.id = 'saved'
    panel.append(saved)
  }
  $('gear').onclick = async () => {
    const open = $('panel').hidden
    if (open) await openSettings()
    $('panel').hidden = !open
    $('gear').setAttribute('aria-expanded', open)
    $('gear').textContent = open ? 'Chat' : 'Settings'
  }

  const source = new EventSource('/events')
  source.onopen = () => { chat.replaceChildren(); lastAt = 0; stuck = true; newest.hidden = true; rest() }  // the server replays what happened
  source.onerror = () => { state('bad', 'Jarvis is off', 'Reconnecting'); $('mic').textContent = $('quiet').textContent = ''; hide(draft); hide(dots) }
  source.onmessage = m => {
    const e = JSON.parse(m.data)
    HANDLERS[e.event]?.(e)
  }
</script>
</body>
</html>
