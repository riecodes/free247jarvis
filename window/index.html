<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<style>
  :root {
    color-scheme: dark light;
    --bg: #14161a; --panel: #23272e; --text: #eceef1; --dim: #9aa1ab; --line: #2c3038; --mine: #2f6fed; --mine-text: #fff;
    --idle: #6b7280; --listen: #34d399; --work: #fbbf24; --speak: #60a5fa; --bad: #f87171;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #e9ebef; --text: #16181d; --dim: #5b6470; --line: #dfe2e7; --mine: #1d5fd8; --mine-text: #fff;
      --idle: #6b7280; --listen: #047857; --work: #b45309; --speak: #1d4ed8; --bad: #b91c1c;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; background: var(--bg); color: var(--text);
    font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
  }
  /* The window's own buttons sit over its right end (main.cjs), and the rest of it drags the window. */
  header {
    display: flex; align-items: center; gap: 10px; height: 46px; flex: none; padding: 0 16px; border-bottom: 1px solid var(--line);
    padding-left: calc(env(titlebar-area-x, 0px) + 16px); /* macOS: its buttons are at the left */
    padding-right: calc(100vw - env(titlebar-area-x, 0px) - env(titlebar-area-width, 100vw) + 16px); -webkit-app-region: drag; app-region: drag;
  }
  header button { -webkit-app-region: no-drag; app-region: no-drag; }
  #dot { width: 12px; height: 12px; border-radius: 50%; background: var(--idle); flex: none; }
  #state { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #detail { margin-left: auto; color: var(--dim); font-size: 12px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body[data-mood=listen] #dot { background: var(--listen); animation: pulse 1.2s ease-in-out infinite; }
  body[data-mood=work] #dot { background: var(--work); animation: pulse 1.2s ease-in-out infinite; }
  body[data-mood=speak] #dot { background: var(--speak); animation: pulse .6s ease-in-out infinite; }
  body[data-mood=bad] #dot { background: var(--bad); }
  @keyframes pulse { 50% { opacity: .35; } }
  #mic, #quiet { padding: 5px 16px; font-size: 12px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  #mic { color: var(--dim); }
  #quiet { color: var(--work); }
  #mic:empty, #quiet:empty { display: none; }
  #wrap { flex: 1; position: relative; min-height: 0; }
  #chat { height: 100%; overflow-y: auto; padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 6px; }
  #chat:empty::before { content: "Say \201CHey Jarvis\201D"; margin: auto; color: var(--dim); }
  .msg { flex: none; max-width: 84%; padding: 8px 12px; border-radius: 16px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .msg > * + * { margin-top: 8px; }
  .msg p, .msg ul, .msg ol, .msg pre, .msg table { margin-bottom: 0; }
  .msg p { margin-top: 0; }
  .msg > * + p { margin-top: 8px; }
  .msg h4 { margin: 0; font-size: inherit; font-weight: 600; }
  .msg ul, .msg ol { margin-top: 0; padding-left: 20px; }
  .msg > * + ul, .msg > * + ol { margin-top: 8px; }
  .msg ul.choices { display: grid; gap: 6px; padding: 0; list-style: none; }
  .choices li { display: flex; gap: 8px; }
  .choices b { flex: none; min-width: 1.1em; }
  .choices span { min-width: 0; }
  .pick {
    display: flex; gap: 8px; width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  .pick:hover:not(:disabled), .pick:focus-visible { border-color: var(--mine); }
  .pick:disabled { cursor: default; opacity: .6; }
  .pick.chosen { opacity: 1; border-color: var(--mine); background: var(--mine); color: var(--mine-text); }
  .picks { display: flex; flex-wrap: wrap; gap: 6px; }
  .picks .pick { width: auto; }
  .msg code { padding: 1px 4px; border-radius: 4px; background: var(--bg); font: 12.5px Consolas, monospace; }
  .msg pre { margin-top: 0; padding: 8px; border-radius: 8px; background: var(--bg); font: 12.5px/1.4 Consolas, monospace; white-space: pre-wrap; }
  .msg > * + pre { margin-top: 8px; }
  .msg table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .msg > * + table { margin-top: 8px; }
  .msg th, .msg td { padding: 3px 6px; border: 1px solid var(--line); text-align: left; vertical-align: top; overflow-wrap: break-word; }
  .you { align-self: flex-end; background: var(--mine); color: var(--mine-text); border-bottom-right-radius: 5px; }
  .me { align-self: flex-start; background: var(--panel); border-bottom-left-radius: 5px; }
  .hello { padding: 4px 11px; color: var(--dim); font-size: 13px; }
  .draft { opacity: .65; }
  .note { align-self: center; max-width: 94%; color: var(--dim); font-size: 12px; text-align: center; overflow-wrap: anywhere; }
  .fail { color: var(--bad); }
  .time { align-self: center; color: var(--dim); font-size: 11px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .dots { display: inline-flex; gap: 4px; padding: 3px 0; vertical-align: middle; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .3; animation: dot 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; }
  .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes dot { 30% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    #dot, .dots i { animation: none !important; }
    .dots i { opacity: .7; }
  }
  #newest {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); padding: 5px 12px; border: 1px solid var(--line);
    border-radius: 14px; background: var(--panel); color: var(--text); font: inherit; font-size: 12px; cursor: pointer;
  }
  #newest[hidden] { display: none; }
  #gear { padding: 2px 8px; border: 1px solid var(--line); border-radius: 8px; background: none; color: var(--dim); font: inherit; font-size: 12px; cursor: pointer; }
  #detail { min-width: 0; }
  @media (max-width: 540px) { #detail { display: none; } #gear { margin-left: auto; } }  /* narrow: the state needs the room beside the window's buttons */
  #panel { position: absolute; inset: 0; overflow-y: auto; padding: 12px 16px; background: var(--bg); }
  #panel[hidden] { display: none; }
  .set { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .set span { flex: 1; min-width: 0; }
  .set b { display: block; font-weight: 600; }
  .set small { display: block; color: var(--dim); font-size: 12px; }
  .set input[type=checkbox] { width: 18px; height: 18px; flex: none; }
  .set input[type=number] { width: 64px; padding: 3px 6px; flex: none; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  #saved { min-height: 20px; padding-top: 8px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body data-mood="idle">
<header>
  <span id="dot" aria-hidden="true"></span>
  <span id="state" role="status">Connecting</span>
  <span id="detail"></span>
  <button id="gear" type="button" aria-expanded="false">Settings</button>
</header>
<div id="mic"></div>
<div id="quiet"></div>
<div id="wrap">
  <div id="chat" role="log" aria-live="polite"></div>
  <button id="newest" type="button" hidden>Newest</button>
  <div id="panel" hidden></div>
</div>
<script>
  const $ = id => document.getElementById(id)
  const body = document.body, chat = $('chat'), newest = $('newest')
  const WAITING = 'Waiting for "Hey Jarvis"'
  const GAP = 5 * 60_000  // a time between messages further apart than this
  let on = true, lastAt = 0, stuck = true  // stuck: following the newest message; off once they scroll up to read

  function state(mood, words, detail = '') {
    body.dataset.mood = mood
    $('state').textContent = words
    $('detail').textContent = detail
  }
  const rest = (detail = '') => state('idle', on ? WAITING : 'Mic off', detail)

  function follow() {
    if (stuck) chat.scrollTop = chat.scrollHeight
    else newest.hidden = false
  }
  chat.addEventListener('scroll', () => {
    stuck = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 60
    if (stuck) newest.hidden = true
  })
  newest.onclick = () => {
    stuck = true
    newest.hidden = true
    follow()
  }

  // What's in progress stays last in the chat: their words as they come, and the dots while it works.
  const draft = document.createElement('div'), dots = document.createElement('div')
  draft.className = 'msg you draft'
  dots.className = 'msg me'
  const dotsHtml = () => {
    const d = document.createElement('span')
    d.className = 'dots'
    d.setAttribute('aria-label', 'Working')
    d.append(...[0, 1, 2].map(() => document.createElement('i')))
    return d
  }
  dots.append(dotsHtml())
  const hide = el => el.remove()
  function show(el) {
    chat.append(el)
    follow()
  }
  let words = ''  // the live words so far
  function listening() {  // no words yet
    words = ''
    draft.replaceChildren(dotsHtml())
    show(draft)
  }
  function liveWords(text) {
    words = stitch(words, text)
    draft.textContent = words
    show(draft)
  }

  // format:start (pure, and check_window.mjs runs it)
  // Free live words cover only the last 15 s, so each batch overlaps the last and a long request would scroll off: this keeps
  // all of it. The newer batch wins from where they meet, since it heard those words with more around them.
  const bare = w => w.toLowerCase().replace(/[^\p{L}\p{N}]/gu, '')
  function stitch(old, next) {
    if (!old) return next
    const a = old.split(/\s+/), b = next.split(/\s+/), from = Math.max(0, a.length - 80)
    let best = 0, endA = 0, endB = 0, run = new Array(b.length + 1).fill(0)
    for (let i = from; i < a.length; i++) {
      const now = new Array(b.length + 1).fill(0)
      for (let j = 0; j < b.length; j++) {
        if (bare(a[i]) && bare(a[i]) === bare(b[j])) {
          now[j + 1] = run[j] + 1
          if (now[j + 1] >= best) [best, endA, endB] = [now[j + 1], i + 1, j + 1]
        }
      }
      run = now
    }
    if (best < Math.min(3, b.length)) return `${old} ${next}`
    return endB === b.length ? old : [...a.slice(0, endA), ...b.slice(endB)].join(' ')
  }

  // "A yes, or B not yet" said in one line: the intro and the rows, or null. Only for show; the voice says the line as it was.
  function spokenChoices(line) {
    const found = []
    for (const m of line.matchAll(/(^|[\s(,;:.?!])((?:[Oo]ption\s+)?)([A-H])(?:[.):,])?(?=\s)/g)) {
      const want = String.fromCharCode(65 + found.length)
      if (m[3] !== want) continue
      if (/\bplan\s*$/i.test(line.slice(0, m.index + m[1].length))) continue  // "plan A" names a thing
      found.push({ h: m[3], from: m.index + m[1].length, to: m.index + m[0].length })
    }
    if (found.length < 2) return null
    const items = found.map((f, i) => ({
      h: f.h,
      text: line.slice(f.to, found[i + 1]?.from ?? line.length).trim().replace(/[\s,;]*(?:\b(?:or|and|o kaya)\b)?[\s,;]*$/i, ''),
    }))
    return items.every(i => bare(i.text)) ? { intro: line.slice(0, found[0].from).trim(), items } : null
  }

  // Text to blocks: paragraphs, lists, lettered choices, code, tables and bold, from what the orch writes.
  function parse(text) {
    const blocks = [], lines = text.replace(/\r/g, '').split('\n')
    let para = []
    const flush = () => {
      if (para.length) blocks.push({ t: 'p', text: para.join('\n') })
      para = []
    }
    const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim())
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i]
      const last = blocks.at(-1)
      let m
      if (/^\s*```/.test(line)) {
        flush()
        const code = []
        while (++i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i])
        blocks.push({ t: 'code', text: code.join('\n') })
      } else if (!line.trim()) flush()
      else if (line.includes('|') && /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(lines[i + 1] ?? '') && lines[i + 1].includes('|')) {
        flush()
        const rows = [cells(line)]
        for (i += 2; i < lines.length && lines[i].includes('|') && lines[i].trim(); i++) rows.push(cells(lines[i]))
        i--
        blocks.push({ t: 'table', rows })
      } else if ((m = line.match(/^\s*#{1,6}\s+(.+)/))) {
        flush()
        blocks.push({ t: 'h', text: m[1] })
      } else if ((m = line.match(/^\s*(?:\*\*)?([A-Z])[.)](?:\*\*)?\s+(.+)/)) && (m[1] === 'A' ? /^\s*(?:\*\*)?B[.)]/.test(lines.slice(i + 1).find(l => l.trim()) ?? '')
        : !para.length && last?.t === 'choices' && m[1].charCodeAt(0) === 65 + last.items.length)) {
        flush()
        if (m[1] === 'A') blocks.push({ t: 'choices', items: [] })
        blocks.at(-1).items.push({ h: m[1], text: m[2] })
      } else if ((m = line.match(/^\s*[-*•]\s+(.+)/)) || (m = line.match(/^\s*\d+[.)]\s+(.+)/))) {
        flush()
        const t = /^\s*\d/.test(line) ? 'ol' : 'ul'
        if (last?.t === t && !para.length && !/^\s*$/.test(lines[i - 1] ?? 'x')) last.items.push(m[1])
        else blocks.push({ t, items: [m[1]] })
      } else if ((m = spokenChoices(line))) {
        if (m.intro) para.push(m.intro)
        flush()
        blocks.push({ t: 'choices', items: m.items })
      } else para.push(line)
    }
    flush()
    return blocks
  }

  // A reply's choices are buttons only when it asks something (rules.mjs asksSomething): "the B side passed" stays text.
  const asks = text => /\?|\b(say|pick|choose|tell me)\b/i.test(text)
  // A plain yes-or-no question as its last sentence gets Yes and No; "Ship it or wait?" doesn't.
  function yesNo(text) {
    const q = text.match(/([^.!?]*)\?\s*$/)?.[1] ?? ''
    return !/\bor\b/i.test(q) && /^\s*(?:\w+,\s*)?(?:should|shall|do|does|did|is|are|was|were|can|could|will|would|want|may|have|has)\b/i.test(q)
  }
  // format:end

  const make = (tag, ...kids) => {  // real nodes, never markup: these words come from speech and other sessions
    const el = document.createElement(tag)
    el.append(...kids)
    return el
  }
  const inline = text => text.split(/(`[^`\n]+`|\*\*[^*\n]+\*\*)/).filter(Boolean).map(part =>
    /^`.+`$/s.test(part) ? make('code', part.slice(1, -1)) : /^\*\*.+\*\*$/s.test(part) ? make('b', part.slice(2, -2)) : part)
  const RENDER = {
    p: b => make('p', ...inline(b.text)),
    h: b => make('h4', ...inline(b.text)),
    code: b => make('pre', b.text),
    ul: b => make('ul', ...b.items.map(i => make('li', ...inline(i)))),
    ol: b => make('ol', ...b.items.map(i => make('li', ...inline(i)))),
    choices: b => {
      const list = make('ul', ...b.items.map(i => make('li', make('b', `${i.h}.`), make('span', ...inline(i.text)))))
      list.className = 'choices'
      return list
    },
    table: b => make('table', ...b.rows.map((r, n) => make('tr', ...r.map(c => make(n ? 'td' : 'th', ...inline(c)))))),
  }

  function add(cls, text, at = Date.now(), raw = '', rich = false) {
    if (at - lastAt > GAP) {
      const t = document.createElement('div')
      t.className = 'time'
      t.textContent = new Date(at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
      chat.insertBefore(t, chat.contains(draft) ? draft : chat.contains(dots) ? dots : null)
    }
    lastAt = at
    const m = document.createElement('div')
    m.className = cls
    if (Array.isArray(rich)) m.append(...rich)
    else if (rich) m.append(...parse(text).map(b => RENDER[b.t](b)))
    else m.textContent = text
    if (raw && raw !== text) m.title = `Heard as: ${raw}`
    chat.insertBefore(m, chat.contains(draft) ? draft : chat.contains(dots) ? dots : null)
    while (chat.children.length > 200) chat.firstChild.remove()
    follow()
  }

  // Clicking a choice answers as if it was said. Only the newest reply's buttons work: a click, an answer by voice or typed,
  // or a newer reply with choices retires them, and they stay in the chat as they were.
  let picks = []
  const retire = () => { for (const b of picks) b.disabled = true; picks = [] }
  async function choose(button, answer) {
    retire()
    button.classList.add('chosen')
    const r = await fetch('/choice', { method: 'POST', body: answer }).catch(() => null)
    if (!r?.ok) add('note fail', "Couldn't send that choice. Say it instead.")
  }
  function reply(e) {
    hide(dots)
    const options = (Array.isArray(e.options) ? e.options : []).map(String).filter(Boolean)
    const ask = !options.length && asks(e.text), buttons = []
    const button = (answer, ...kids) => {
      const b = make('button', ...kids)
      b.type = 'button'
      b.className = 'pick'
      b.onclick = () => choose(b, answer)
      buttons.push(b)
      return b
    }
    const list = items => {
      const l = make('ul', ...items.map(([h, text]) => make('li', button(h, make('b', `${h}.`), make('span', ...inline(text))))))
      l.className = 'choices'
      return l
    }
    const nodes = parse(e.text).map(b => !ask ? RENDER[b.t](b) : b.t === 'choices' ? list(b.items.map(i => [i.h, i.text]))
      : b.t === 'ol' ? list(b.items.map((t, n) => [String(n + 1), t])) : RENDER[b.t](b))
    const row = options.length ? options : ask && !buttons.length && yesNo(e.text) ? ['Yes', 'No'] : []
    if (row.length) {
      const r = make('div', ...row.map(o => button(o, o)))
      r.className = 'picks'
      nodes.push(r)
    }
    add('msg me', e.text, e.at, '', nodes)
    if (buttons.length) (retire(), picks = buttons)
  }

  const HANDLERS = {
    state: e => {
      on = e.on
      rest()
      $('mic').textContent = on ? `Mic: ${e.mic || 'name unknown'}` : 'Mic: none open'
    },
    wake: () => { hide(dots); listening(); state('listen', 'Listening') },
    greeting: e => add('msg me hello', e.text, e.at),
    reminder: e => add('msg me', e.text, e.at, '', true),
    partial: e => liveWords(e.text),
    heard: e => {
      retire()
      hide(draft)
      add('msg you', e.text, e.at, e.raw)
      show(dots)
      state('work', 'Thinking')
    },
    nothing: () => { hide(draft); hide(dots); rest('Heard no request') },
    route: e => $('detail').textContent = `${e.kind}, ${e.ms} ms`,
    sent: e => {
      retire()
      if (e.via !== 'mic') add('msg you', e.text, e.at)
      show(dots)
      state('work', 'Claude is working')
    },
    reply,
    again: e => { hide(draft); add('msg you', e.text, e.at); reply({ text: e.line, at: e.at }) },
    said: () => state('speak', 'Speaking'),
    spoken: e => {
      if (e.listening) {
        listening()
        state('listen', 'Listening for your answer')
      } else rest()
    },
    held: e => add('note', `Held for after your call: ${e.text}`, e.at),
    queued: () => $('detail').textContent = 'A line is waiting for you to finish',
    peak: e => { if (e.score < 0.5) $('detail').textContent = `Last try ${e.score}` },
    status: e => { if (/^Voice:|^Using |now on /.test(e.text)) add('note', e.text, e.at) },
    caption: e => add('note', e.text, e.at),
    quiet: e => $('quiet').textContent = e.on ? `Staying quiet: ${e.text}. Lines wait, and the wake word must be clear.` : '',
    error: e => add('note fail', e.message, e.at),
  }

  // Settings: every change is saved and applied by the voice at once.
  async function saveSetting(key, value) {
    const r = await fetch('/settings', { method: 'POST', body: JSON.stringify({ key, value }) }).catch(() => null)
    $('saved').textContent = r?.ok ? 'Saved. It applies now.' : "Couldn't save that."
    return r?.ok
  }
  async function openSettings() {
    const list = await (await fetch('/settings')).json()
    const panel = $('panel')
    panel.replaceChildren(...list.map(s => {
      const row = document.createElement('label'), words = document.createElement('span')
      const name = document.createElement('b'), hint = document.createElement('small'), input = document.createElement('input')
      row.className = 'set'
      name.textContent = s.label
      hint.textContent = s.hint
      words.append(name, hint)
      if (s.options) {
        input.type = 'checkbox'
        input.checked = s.value === s.options[0]
        input.onchange = async () => {
          if (!await saveSetting(s.key, input.checked ? s.options[0] : s.options[1])) input.checked = !input.checked
        }
      } else {
        input.type = 'number'
        Object.assign(input, { min: s.min, max: s.max, value: s.value })
        input.onchange = () => saveSetting(s.key, input.value)
      }
      row.append(words, input)
      return row
    }))
    const saved = document.createElement('div')
    saved.id = 'saved'
    panel.append(saved)
  }
  $('gear').onclick = async () => {
    const open = $('panel').hidden
    if (open) await openSettings()
    $('panel').hidden = !open
    $('gear').setAttribute('aria-expanded', open)
    $('gear').textContent = open ? 'Chat' : 'Settings'
  }

  const source = new EventSource('/events')
  source.onopen = () => { chat.replaceChildren(); lastAt = 0; stuck = true; newest.hidden = true; rest() }  // the server replays what happened
  source.onerror = () => { state('bad', 'Jarvis is off', 'Reconnecting'); $('mic').textContent = $('quiet').textContent = ''; hide(draft); hide(dots) }
  source.onmessage = m => {
    const e = JSON.parse(m.data)
    HANDLERS[e.event]?.(e)
  }
</script>
</body>
</html>
