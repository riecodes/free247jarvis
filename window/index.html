<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>💠 Jarvis</title>
<style>
  /* A HUD: deep navy, cyan light. --glow is the soft halo on whatever is active. */
  :root {
    color-scheme: dark light;
    --bg: #050c16; --panel: #0c1b2d; --text: #dcf4ff; --dim: #7fa3bd; --line: #15314a; --mine: #22b8f0; --mine-text: #001521;
    --idle: #4d6880; --listen: #22d3ee; --work: #fbbf24; --speak: #38bdf8; --bad: #f87171;
    --glow: rgba(34, 211, 238, .45); --haze: rgba(14, 116, 180, .18);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f1f8fd; --panel: #dfeef8; --text: #0a1b2c; --dim: #4b6880; --line: #cbdfec; --mine: #0369a1; --mine-text: #fff;
      --idle: #64809a; --listen: #0e7490; --work: #b45309; --speak: #0369a1; --bad: #b91c1c;
      --glow: rgba(3, 105, 161, .3); --haze: rgba(56, 189, 248, .14);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; background: radial-gradient(120% 60% at 50% 0%, var(--haze), transparent 70%) var(--bg);
    color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
  }
  /* The window's own buttons sit over its right end (main.cjs), and the rest of it drags the window. */
  header {
    display: flex; align-items: center; gap: 10px; height: 46px; flex: none; padding: 0 16px; border-bottom: 1px solid var(--line);
    background: var(--bg); /* solid, to match the window buttons' overlay color in main.cjs */
    padding-left: calc(env(titlebar-area-x, 0px) + 16px); /* macOS: its buttons are at the left */
    padding-right: calc(100vw - env(titlebar-area-x, 0px) - env(titlebar-area-width, 100vw) + 16px); -webkit-app-region: drag; app-region: drag;
  }
  header button { -webkit-app-region: no-drag; app-region: no-drag; }
  #dot { width: 12px; height: 12px; border-radius: 50%; background: var(--idle); flex: none; }
  #state { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #detail { margin-left: auto; color: var(--dim); font-size: 12px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body[data-mood=listen] #dot { background: var(--listen); box-shadow: 0 0 10px 2px var(--glow); animation: pulse 1.2s ease-in-out infinite; }
  body[data-mood=work] #dot { background: var(--work); animation: pulse 1.2s ease-in-out infinite; }
  body[data-mood=speak] #dot { background: var(--speak); box-shadow: 0 0 10px 2px var(--glow); animation: pulse .6s ease-in-out infinite; }
  body[data-mood=listen] header, body[data-mood=speak] header { box-shadow: 0 8px 20px -14px var(--glow); }
  body[data-mood=bad] #dot { background: var(--bad); }
  @keyframes pulse { 50% { opacity: .35; } }
  #mic, #quiet { padding: 5px 16px; font-size: 12px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  #mic { color: var(--dim); }
  #quiet { color: var(--work); }
  #mic:empty, #quiet:empty { display: none; }
  /* The orb (orb/, MIT, from github.com/weeeha/AI-Orb): the main thing on screen. Big while the chat is empty, small once it has words. */
  #stage { --s: 200px; flex: none; height: var(--s); display: flex; align-items: center; justify-content: center; overflow: hidden; transition: height .55s cubic-bezier(.32, .72, 0, 1); }
  body:has(#chat:not(:empty)) #stage { --s: 104px; }
  #orbbox { flex: none; height: calc(var(--s) - 16px); aspect-ratio: 1; transition: height .55s cubic-bezier(.32, .72, 0, 1); }  /* the box sizes the canvas, never the other way round */
  #orb { display: block; width: 100%; height: 100%; }
  @media (max-height: 420px) { #stage { display: none; } }
  #wrap { flex: 1; position: relative; min-height: 0; }
  #chat { height: 100%; overflow-y: auto; padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 6px; }
  #chat:empty::before { content: "\1F4A0  Say \201CHey Jarvis\201D"; margin: auto; color: var(--dim); }
  .msg { flex: none; max-width: 84%; padding: 8px 12px; border-radius: 16px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .msg > * + * { margin-top: 8px; }
  .msg p, .msg ul, .msg ol, .msg pre, .msg table { margin-bottom: 0; }
  .msg p { margin-top: 0; }
  .msg > * + p { margin-top: 8px; }
  .msg h4 { margin: 0; font-size: inherit; font-weight: 600; }
  .msg ul, .msg ol { margin-top: 0; padding-left: 20px; }
  .msg > * + ul, .msg > * + ol { margin-top: 8px; }
  .msg ul.choices { display: grid; gap: 6px; padding: 0; list-style: none; }
  .choices li { display: flex; gap: 8px; }
  .choices b { flex: none; min-width: 1.1em; }
  .choices span { min-width: 0; }
  .pick {
    display: flex; gap: 8px; width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  .pick:hover:not(:disabled), .pick:focus-visible { border-color: var(--mine); }
  .pick:disabled { cursor: default; opacity: .6; }
  .pick.chosen { opacity: 1; border-color: var(--mine); background: var(--mine); color: var(--mine-text); box-shadow: 0 0 12px var(--glow); }
  .picks { display: flex; flex-wrap: wrap; gap: 6px; }
  .picks .pick { width: auto; }
  .msg code { padding: 1px 4px; border-radius: 4px; background: var(--bg); font: 12.5px Consolas, monospace; }
  .msg pre { margin-top: 0; padding: 8px; border-radius: 8px; background: var(--bg); font: 12.5px/1.4 Consolas, monospace; white-space: pre-wrap; }
  .msg > * + pre { margin-top: 8px; }
  .msg table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .msg > * + table { margin-top: 8px; }
  .msg th, .msg td { padding: 3px 6px; border: 1px solid var(--line); text-align: left; vertical-align: top; overflow-wrap: break-word; }
  .you { align-self: flex-end; background: var(--mine); color: var(--mine-text); border-bottom-right-radius: 5px; }
  .me { align-self: flex-start; background: var(--panel); border-bottom-left-radius: 5px; }
  .hello { padding: 4px 11px; color: var(--dim); font-size: 13px; }
  .draft { opacity: .65; }
  .note { align-self: center; max-width: 94%; color: var(--dim); font-size: 12px; text-align: center; overflow-wrap: anywhere; }
  .fail { color: var(--bad); }
  .time { align-self: center; color: var(--dim); font-size: 11px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .dots { display: inline-flex; gap: 4px; padding: 3px 0; vertical-align: middle; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .3; animation: dot 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; }
  .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes dot { 30% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    #stage, #orbbox { transition: none; }
    #dot, .dots i { animation: none !important; }
    .dots i { opacity: .7; }
  }
  #newest {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); padding: 5px 12px; border: 1px solid var(--line);
    border-radius: 14px; background: var(--panel); color: var(--text); font: inherit; font-size: 12px; cursor: pointer;
  }
  #newest[hidden] { display: none; }
  #gear { padding: 2px 8px; border: 1px solid var(--line); border-radius: 8px; background: none; color: var(--dim); font: inherit; font-size: 12px; cursor: pointer; }
  #detail { min-width: 0; }
  @media (max-width: 540px) { #detail { display: none; } #gear { margin-left: auto; } }  /* narrow: the state needs the room beside the window's buttons */
  #panel { position: absolute; inset: 0; overflow-y: auto; padding: 12px 16px; background: var(--bg); }
  #panel[hidden] { display: none; }
  .set { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .set span { flex: 1; min-width: 0; }
  .set b { display: block; font-weight: 600; }
  .set small { display: block; color: var(--dim); font-size: 12px; }
  .set input[type=checkbox] { width: 18px; height: 18px; flex: none; }
  .set select { max-width: 50%; padding: 3px 6px; flex: none; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  .set input[type=text] { width: 120px; padding: 3px 6px; flex: none; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  .set input[type=number] { width: 64px; padding: 3px 6px; flex: none; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  #saved { min-height: 20px; padding-top: 8px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body data-mood="idle">
<header>
  <span id="dot" aria-hidden="true"></span>
  <span id="state" role="status">Connecting</span>
  <span id="detail"></span>
  <button id="gear" type="button" aria-expanded="false">Settings</button>
</header>
<div id="mic"></div>
<div id="quiet"></div>
<div id="stage"><div id="orbbox"><canvas id="orb" aria-hidden="true"></canvas></div></div>
<div id="wrap">
  <div id="chat" role="log" aria-live="polite"></div>
  <button id="newest" type="button" hidden>Newest</button>
  <div id="panel" hidden></div>
</div>
<script>
  const $ = id => document.getElementById(id);  // the ; matters: the bundle below starts with a parenthesis
  // orb:start (build: node orb/build.mjs, which refreshes the bundle below from orb/*.ts)
  // orb:bundle
(()=>{var d=`
attribute vec2 aPos;
varying vec2 vUv;
void main() {
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}
`,v=`
precision highp float;

varying vec2 vUv;

uniform float uTime;    // wall clock, for grain
uniform float uFlow;    // accumulated interior time, accelerated by output level
uniform float uRing;    // accumulated ring phase, advanced by input level
uniform int   uFinish;  // 0 ink \xB7 1 pearl \xB7 2 vessel \xB7 3 aurora \xB7 4 plasma
uniform int   uState;   // 0 idle \xB7 1 listening \xB7 2 thinking \xB7 3 speaking
uniform float uDark;    // 0 light field, 1 dark field
uniform float uIn;      // 0-1 microphone level
uniform float uOut;     // 0-1 agent speech level
uniform float uGrain;
uniform float uSeed;
uniform float uDetail;  // 0 at avatar sizes, 1 at hero sizes
uniform vec3  uC1;
uniform vec3  uC2;
uniform vec3  uC3;
uniform vec3  uBody;
uniform vec2  uPointer;
uniform float uPtr;

const float PI  = 3.141592653589793;
const float TAU = 6.283185307179586;

float hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float noise2(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash21(i), b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0)), d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  mat2 rot = mat2(0.8776, 0.4794, -0.4794, 0.8776);
  for (int i = 0; i < 5; i++) {
    v += a * noise2(p);
    p = rot * p * 2.02 + vec2(37.1, 11.7);
    a *= 0.5;
  }
  return v;
}

vec3 ramp(float t) {
  t = clamp(t, 0.0, 1.0);
  return t < 0.5 ? mix(uC1, uC2, t * 2.0) : mix(uC2, uC3, (t - 0.5) * 2.0);
}

void main() {
  // Output swells the orb, input contracts it very slightly. Budget is \xB12% (P2).
  float grow = 1.0 + 0.020 * uOut - 0.008 * uIn;
  vec2 p = (vUv - 0.5) * 2.0 / grow;
  float r = length(p);

  float seed = uSeed * 13.77;
  float fl = uFlow + seed;

  float bulge = sqrt(max(1.0 - min(dot(p, p), 1.0), 0.0));
  vec3 n = vec3(p, bulge);

  // sp stays in orb space. The seed offsets only where noise is sampled --
  // adding it to sp itself would slide the band clean off finishes that place
  // features relative to the centre, which reads as a blank orb.
  vec2 sp = p / (bulge * 0.55 + 1.0);
  vec2 sv = vec2(seed, seed * 0.73);

  float warp = 1.0 + 1.15 * uOut;
  vec3 col = vec3(0.0);
  float alpha = 1.0 - smoothstep(0.982, 1.0, r);

  // ---- INK: one pigmented medium, domain-warped -----------------------------
  if (uFinish == 0) {
    vec2 q = vec2(fbm(sp * 1.9 + sv + fl * 0.05), fbm(sp * 1.9 + sv + vec2(5.2, 1.3) - fl * 0.04));
    vec2 w = vec2(
      fbm(sp * 1.9 + sv + q * (2.1 * warp) + vec2(1.7, 9.2) + fl * 0.034),
      fbm(sp * 1.9 + sv + q * (2.1 * warp) + vec2(8.3, 2.8) - fl * 0.027)
    );
    float f = fbm(sp * 2.2 + sv + w * (1.6 * warp));
    col = ramp(f * 1.5 - 0.18);
    col *= 0.72 + 0.5 * bulge;
    col += pow(1.0 - bulge, 3.5) * 0.1;
    col *= 1.0 + 0.22 * uOut;
  }

  // ---- PEARL: opaque pale body, colour in an equatorial band ----------------
  else if (uFinish == 1) {
    float wob = fbm(sp * 1.5 + sv + fl * 0.07);
    float wave = 0.17 * sin(sp.x * 1.9 + fl * 0.36) + 0.14 * (wob - 0.5);
    float width = 0.40 + 0.16 * uOut;
    float band = smoothstep(width, 0.02, abs(sp.y - wave));

    col = mix(uBody, ramp(sp.x * 0.5 + 0.5 + 0.12 * (wob - 0.5)), band * (0.80 + 0.16 * uOut));

    float striate = 0.5 + 0.5 * sin(sp.x * 40.0 + wob * 11.0 + fl * 0.24);
    col *= 1.0 - 0.045 * striate * band * uDetail;
    col *= 0.80 + 0.34 * bulge;

    vec3 L = normalize(vec3(-0.42, 0.58, 0.70));
    col += vec3(1.0) * pow(max(dot(normalize(n), L), 0.0), 34.0) * 0.85;  // the one peak (P5)
    col += vec3(0.9, 0.93, 1.0) * pow(1.0 - bulge, 6.0) * 0.28;
  }

  // ---- VESSEL: fixed shell, contents that drift and merge -------------------
  else if (uFinish == 2) {
    vec3 acc = vec3(0.0);
    float field = 0.0;
    // Contents pressed against the glass read as attention; drawn to the centre
    // they read as idle. Output drives that ratio, which is the whole signal.
    float spread = 0.26 + 0.16 * uOut + 0.04 * sin(fl * 0.3);
    float mass = 0.150 + 0.055 * uOut;

    for (int i = 0; i < 3; i++) {
      float fi = float(i);
      float orbit = spread + 0.05 * sin(fl * 0.37 + fi * 1.7);
      vec2 c = vec2(cos(fl * 0.42 + fi * 2.094), sin(fl * 0.35 + fi * 2.094)) * orbit;
      float w = mass / (dot(p - c, p - c) + 0.034);
      vec3 lc = fi < 0.5 ? uC1 : (fi < 1.5 ? uC2 : uC3);
      field += w;
      acc += w * lc;
    }

    vec3 inner = acc / max(field, 0.0001);
    float body = smoothstep(0.80, 2.10, field);
    col = mix(uBody, inner, body * 0.96);

    float rim = smoothstep(0.72, 0.99, r) * smoothstep(1.0, 0.88, r);
    col += mix(vec3(0.55, 0.76, 0.94), vec3(0.52, 0.84, 1.0), uDark) * rim * (0.26 + 0.38 * uDark);
    col += vec3(1.0) * pow(1.0 - bulge, 8.0) * 0.14;

    vec3 L2 = normalize(vec3(-0.40, 0.60, 0.69));
    col += vec3(1.0) * pow(max(dot(normalize(n), L2), 0.0), 46.0) * 0.45;
  }

  // ---- AURORA: transparent body, emissive band, rim light -------------------
  else if (uFinish == 3) {
    float wob = fbm(sp * 1.35 + sv - fl * 0.055);
    float wave = 0.16 * sin(sp.x * 1.7 - fl * 0.29) + 0.16 * (wob - 0.5);
    float width = 0.46 + 0.18 * uOut;
    float band = pow(smoothstep(width, 0.0, abs(sp.y - wave - 0.06)), 1.35);

    col = uBody;
    col += ramp(sp.x * 0.45 + 0.5 + 0.2 * (wob - 0.5)) * band * (1.02 + 0.45 * uOut);

    float rim = smoothstep(0.80, 0.995, r) * smoothstep(1.0, 0.94, r);
    col += mix(uC3, vec3(0.55, 0.76, 0.98), 0.5) * rim * 0.85;
    col += uC1 * pow(1.0 - bulge, 5.0) * 0.16;
  }

  // ---- PLASMA: filaments from a core to the glass ---------------------------
  else {
    float a = atan(p.y, p.x);
    float haze = pow(max(1.0 - r, 0.0), 1.35);
    col = mix(uBody, uC1, haze * 0.92);
    col *= 0.50 + 0.72 * bulge;

    float pAng = atan(uPointer.y, uPointer.x);
    float bolts = 0.0;
    float contact = 0.0;

    for (int i = 0; i < 9; i++) {
      float fi = float(i);
      float s = fi * 17.31 + 3.7 + seed;
      float phase = fi * (TAU / 9.0) + (fbm(vec2(s, fl * 0.09)) - 0.5) * 2.6;

      // A real globe bends its filaments toward whatever touches the glass.
      float pull = uPtr * (0.42 + 0.46 * fract(fi * 0.37));
      float dd = mod(pAng - phase + PI, TAU) - PI;
      phase += dd * pull;

      float slow = (fbm(vec2(s * 0.61 + r * 1.35, fl * 0.40)) - 0.5) * 1.55;
      float fine = (fbm(vec2(s * 1.9 + r * 3.1, fl * 0.62)) - 0.5) * 0.42;
      float wander = (slow + fine) * pow(r, 1.15) * (1.0 - 0.42 * uPtr);

      float d = mod(a - phase - wander + PI, TAU) - PI;
      float arc = abs(d) * max(r, 0.05);
      float width = (0.007 + 0.020 * r) * mix(2.1, 1.0, uDetail);
      float line = smoothstep(width, 0.0, arc);
      float halo = smoothstep(width * 4.5, 0.0, arc) * 0.30;

      // Input makes the filaments reach further out (P10: input owns the boundary).
      float span = 0.80 + 0.20 * fract(s * 0.113) + 0.20 * uIn;
      line *= smoothstep(0.10, 0.28, r) * smoothstep(span + 0.22, span - 0.12, r);
      halo *= smoothstep(0.10, 0.34, r) * smoothstep(span + 0.24, span - 0.14, r);

      float flick = 0.35 + 0.65 * fbm(vec2(s, fl * 2.6));
      line *= flick;
      halo *= flick;

      bolts += line + halo;
      contact += line * smoothstep(span - 0.26, span + 0.04, r);
    }

    bolts = clamp(bolts * (1.0 + 1.05 * uOut), 0.0, 1.8);
    contact = clamp(contact, 0.0, 1.5);

    col += uC3 * bolts * (0.82 + 0.38 * uOut);
    col += mix(uC2, uC3, 0.4) * contact * (0.50 + 2.4 * uIn);

    float coreR = 0.13 + 0.040 * uOut;
    float core = smoothstep(coreR, 0.0, r);
    col += uC2 * pow(smoothstep(0.34, 0.0, r), 2.0) * (0.55 + 0.35 * uOut);
    col += mix(uC2, vec3(1.0, 0.97, 1.0), core) * core * 1.30;

    float grim = smoothstep(0.84, 0.995, r) * smoothstep(1.0, 0.92, r);
    col += mix(uC1, uC2, 0.5) * grim * (0.55 + 0.9 * uIn);
  }

  // ---- Thinking: an orbiting sweep, distinct in form from either voice (P8) --
  if (uState == 2) {
    float ang = atan(p.y, p.x);
    float sweep = 0.5 + 0.5 * cos(ang - fl * 1.5);
    col += mix(uC2, uC3, 0.5) * pow(sweep, 7.0) * 0.40 * smoothstep(0.05, 0.85, r);
  }

  // ---- Input lives on the boundary, never in the body (P10) -----------------
  if (uIn > 0.004 && uFinish != 4) {
    float pd = fract(r * 1.35 - uRing);
    float pulse = smoothstep(0.0, 0.30, pd) - smoothstep(0.30, 0.62, pd);
    vec3 pc = mix(uC3, vec3(0.42, 0.92, 0.99), 0.35 + 0.3 * uDark);
    col += pc * pulse * uIn * 1.15 * smoothstep(0.10, 0.95, r);
    float rim2 = smoothstep(0.74, 0.995, r) * smoothstep(1.0, 0.90, r);
    col += pc * rim2 * uIn * 1.5;
  }

  // ---- Grain: defeats banding and gives the eye something to resolve (P6) ---
  float g = hash21(vUv * 780.0 + fract(uTime) * 91.0);
  col *= 1.0 - uGrain * uDetail * (g - 0.5) * 2.0;

  gl_FragColor = vec4(clamp(col, 0.0, 1.0) * alpha, alpha);
}

      } else rest()
    },
    held: e => add('note', `Held for after your call: ${e.text}`, e.at),
    queued: () => $('detail').textContent = 'A line is waiting for you to finish',
    peak: e => { if (e.score < 0.5) $('detail').textContent = `Last try ${e.score}` },
    status: e => { if (/^Voice:|^Using |now on /.test(e.text)) add('note', e.text, e.at) },
    caption: e => add('note', e.text, e.at),
    quiet: e => $('quiet').textContent = e.on ? `Staying quiet: ${e.text}. Lines wait, and the wake word must be clear.` : '',
    error: e => add('note fail', e.message, e.at),
  }

  // Settings: every change is saved and applied by the voice at once.
  async function saveSetting(key, value) {
    const r = await fetch('/settings', { method: 'POST', body: JSON.stringify({ key, value }) }).catch(() => null)
    $('saved').textContent = r?.ok ? 'Saved. It applies now.' : "Couldn't save that."
    return r?.ok
  }
  async function openSettings() {
    const list = await (await fetch('/settings')).json()
    const panel = $('panel')
    panel.replaceChildren(...list.map(s => {
      const row = document.createElement('label'), words = document.createElement('span')
      const name = document.createElement('b'), hint = document.createElement('small')
      const input = document.createElement(s.device ? 'select' : 'input')
      row.className = 'set'
      name.textContent = s.label
      hint.textContent = s.hint
      words.append(name, hint)
      if (s.device) {  // '' is Windows default; a saved device that's unplugged stays listed, so the pick shows
        // .env may hold part of a name (MIC_DEVICE=Shokz): the first device containing it is the one in use
        const value = s.value && (s.choices.find(c => c.toLowerCase().includes(s.value.toLowerCase())) ?? s.value)
        const names = value && !s.choices.includes(value) ? [...s.choices, value] : s.choices
        input.append(...['', ...names].map(n => new Option(n || 'Windows default', n)))
        input.value = value
        input.onchange = () => saveSetting(s.key, input.value)
      } else if (s.options) {
        input.type = 'checkbox'
        input.checked = s.value === s.options[0]
        input.onchange = async () => {
          if (!await saveSetting(s.key, input.checked ? s.options[0] : s.options[1])) input.checked = !input.checked
        }
      } else if (s.text) {
        Object.assign(input, { type: 'text', value: s.value, maxLength: 40 })
        input.onchange = () => saveSetting(s.key, input.value.trim())
      } else {
        input.type = 'number'
        Object.assign(input, { min: s.min, max: s.max, value: s.value })
        input.onchange = () => saveSetting(s.key, input.value)
      }
      row.append(words, input)
      return row
    }))
    const saved = document.createElement('div')
    saved.id = 'saved'
    panel.append(saved)
  }
  $('gear').onclick = async () => {
    const open = $('panel').hidden
    if (open) await openSettings()
    $('panel').hidden = !open
    $('gear').setAttribute('aria-expanded', open)
    $('gear').textContent = open ? 'Chat' : 'Settings'
  }

  const source = new EventSource('/events')
  source.onopen = () => { chat.replaceChildren(); lastAt = 0; stuck = true; newest.hidden = true; rest() }  // the server replays what happened
  source.onerror = () => { state('bad', 'Jarvis is off', 'Reconnecting'); $('mic').textContent = $('quiet').textContent = ''; hide(draft); hide(dots) }
  source.onmessage = m => {
    const e = JSON.parse(m.data)
    HANDLERS[e.event]?.(e)
  }
</script>
</body>
</html>
