  /* Graphite surfaces, one blue accent (the orb's), Geist for the words and the terminal's own monospace for code. Floating parts (the dock, the sheet, the
     first-run card) are glass: a blur of what scrolls under them, with a hairline and a top highlight. */
  :root {
    color-scheme: dark light;
    --font: Geist, "Segoe UI", system-ui, sans-serif;
    --mono: "Cascadia Mono", "Cascadia Code", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --bg: #0c0d0f; --panel: #17181b; --text: #ececee; --dim: #9a9ca3; --line: rgba(255, 255, 255, .09);
    --glass: rgba(34, 36, 41, .56); --glass-line: rgba(255, 255, 255, .14); --hi: rgba(255, 255, 255, .16);
    --sheet: rgba(24, 25, 29, .86); --scrim: rgba(0, 0, 0, .45);
    --mine: #ececee; --mine-text: #0c0d0f; --accent: #6cb6ff; --work: #e6b450; --bad: #ff8a80; --off: #3a3c42;
    --ease: cubic-bezier(.32, .72, 0, 1);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f4f2; --panel: #e9e9e6; --text: #17181a; --dim: #62646b; --line: rgba(0, 0, 0, .1);
      --glass: rgba(255, 255, 255, .6); --glass-line: rgba(0, 0, 0, .1); --hi: rgba(255, 255, 255, .9);
      --sheet: rgba(250, 250, 248, .9); --scrim: rgba(0, 0, 0, .25);
      --mine: #17181a; --mine-text: #fff; --accent: #0a63c9; --work: #8a5a00; --bad: #b3261e; --off: #cfd0d3;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); overflow: hidden; }
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .glass {
    background: var(--glass); border: 1px solid var(--glass-line); box-shadow: inset 0 1px 0 var(--hi);
    -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6);
  }
  /* The window's own buttons sit over its right end (main.cjs), and the rest of it drags the window. */
  header {
    display: flex; align-items: center; gap: 12px; height: 46px; flex: none; padding: 0 16px; border-bottom: 1px solid var(--line);
    background: var(--bg); /* solid, to match the window buttons' overlay color in main.cjs */
    padding-left: calc(env(titlebar-area-x, 0px) + 16px); /* macOS: its buttons are at the left */
    padding-right: calc(100vw - env(titlebar-area-x, 0px) - env(titlebar-area-width, 100vw) + 16px); -webkit-app-region: drag; app-region: drag;
  }
  #state { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #detail { margin-left: auto; color: var(--dim); font-size: 12px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  body[data-mood=listen] #state { color: var(--accent); }
  body[data-mood=work] #state { color: var(--work); }
  body[data-mood=bad] #state { color: var(--bad); }
  #quiet { padding: 6px 16px; font-size: 12px; color: var(--work); border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  #quiet:empty { display: none; }
  /* The orb (orb/, MIT, from github.com/weeeha/AI-Orb): the one bright thing. Big while the chat is empty, small once it has words. */

precision highp float;

uniform float uFlow;    // accumulated interior time, accelerated by output level
uniform float uRing;    // accumulated ring phase, advanced by input level
uniform int   uFinish;  // 0 ink \xB7 1 pearl \xB7 2 vessel \xB7 3 aurora \xB7 4 plasma
uniform int   uState;   // 0 idle \xB7 1 listening \xB7 2 thinking \xB7 3 speaking

uniform float uIn;      // 0-1 microphone level
uniform float uOut;     // 0-1 agent speech level

uniform float uSeed;
uniform float uDetail;  // 0 at avatar sizes, 1 at hero sizes

uniform vec3  uC2;
uniform vec3  uC3;
uniform vec3  uBody;
uniform vec2  uPointer;

const float PI  = 3.141592653589793;

float hash21(vec2 p) {

  p += dot(p, p + 45.32);

  float a = hash21(i), b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0)), d = hash21(i + vec2(1.0, 1.0));

float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  mat2 rot = mat2(0.8776, 0.4794, -0.4794, 0.8776);

  const WAITING = 'Waiting for "Hey Jarvis"'
  const GAP = 5 * 60_000  // a time between messages further apart than this
  let on = true, lastAt = 0, stuck = true  // stuck: following the newest message; off once they scroll up to read

  function state(mood, words, detail = '') {
    body.dataset.mood = mood
    orb?.set(mood)
    $('state').textContent = words
    $('detail').textContent = detail
  }
  const rest = (detail = '') => state('idle', on ? WAITING : 'Mic off', detail)

  function follow() {
    if (stuck) chat.scrollTop = chat.scrollHeight
    else newest.classList.add('fresh')  // something arrived while they read further up
  }
  chat.addEventListener('scroll', () => {
    stuck = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 60
    newest.hidden = stuck
    if (stuck) newest.classList.remove('fresh')
  })
  newest.onclick = () => chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' })  // the scroll event then marks it stuck

  // What's in progress stays last in the chat: their words as they come, and the dots while it works.
  const draft = document.createElement('div'), dots = document.createElement('div')
  draft.className = 'msg you draft'
  dots.className = 'msg me'
  const dotsHtml = () => {
    const d = document.createElement('span')
    d.className = 'dots'
    d.setAttribute('aria-label', 'Working')
    d.append(...[0, 1, 2].map(() => document.createElement('i')))
    return d
  }
  dots.append(dotsHtml())
  const hide = el => el.remove()
  function show(el) {
    chat.append(el)
    follow()
  }
  let words = ''  // the live words so far
  function listening() {  // no words yet
    words = ''
    draft.replaceChildren(dotsHtml())
    show(draft)
  }
  function liveWords(text) {
    words = stitch(words, text)
    draft.textContent = words
    show(draft)
  }

  // format:start (pure, and check_window.mjs runs it)
  // Free live words cover only the last 15 s, so each batch overlaps the last and a long request would scroll off: this keeps
  // all of it. The newer batch wins from where they meet, since it heard those words with more around them.
  const bare = w => w.toLowerCase().replace(/[^\p{L}\p{N}]/gu, '')
  function stitch(old, next) {
    if (!old) return next
    const a = old.split(/\s+/), b = next.split(/\s+/), from = Math.max(0, a.length - 80)
    let best = 0, endA = 0, endB = 0, run = new Array(b.length + 1).fill(0)
    for (let i = from; i < a.length; i++) {
      const now = new Array(b.length + 1).fill(0)
      for (let j = 0; j < b.length; j++) {
        if (bare(a[i]) && bare(a[i]) === bare(b[j])) {
          now[j + 1] = run[j] + 1
          if (now[j + 1] >= best) [best, endA, endB] = [now[j + 1], i + 1, j + 1]
        }
      }
      run = now
    }
    if (best < Math.min(3, b.length)) return `${old} ${next}`
    return endB === b.length ? old : [...a.slice(0, endA), ...b.slice(endB)].join(' ')
  }

  // "A yes, or B not yet" said in one line: the intro and the rows, or null. Only for show; the voice says the line as it was.
  function spokenChoices(line) {
    const found = []
    for (const m of line.matchAll(/(^|[\s(,;:.?!])((?:[Oo]ption\s+)?)([A-H])(?:[.):,])?(?=\s)/g)) {
      const want = String.fromCharCode(65 + found.length)
      if (m[3] !== want) continue
      if (/\bplan\s*$/i.test(line.slice(0, m.index + m[1].length))) continue  // "plan A" names a thing
      found.push({ h: m[3], from: m.index + m[1].length, to: m.index + m[0].length })
    }
    if (found.length < 2) return null
    const items = found.map((f, i) => ({
      h: f.h,
      text: line.slice(f.to, found[i + 1]?.from ?? line.length).trim().replace(/[\s,;]*(?:\b(?:or|and|o kaya)\b)?[\s,;]*$/i, ''),
    }))
    return items.every(i => bare(i.text)) ? { intro: line.slice(0, found[0].from).trim(), items } : null
  }

  // Text to blocks: paragraphs, lists, lettered choices, code, tables and bold, from what Jarvis writes.
  function parse(text) {
    const blocks = [], lines = text.replace(/\r/g, '').split('\n')
    let para = []
    const flush = () => {
      if (para.length) blocks.push({ t: 'p', text: para.join('\n') })
      para = []
    }
    const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim())
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i]
      const last = blocks.at(-1)
      let m
      if (/^\s*```/.test(line)) {
        flush()
        const code = []
        while (++i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i])
        blocks.push({ t: 'code', text: code.join('\n') })
      } else if (!line.trim()) flush()
      else if (line.includes('|') && /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(lines[i + 1] ?? '') && lines[i + 1].includes('|')) {
        flush()
        const rows = [cells(line)]
        for (i += 2; i < lines.length && lines[i].includes('|') && lines[i].trim(); i++) rows.push(cells(lines[i]))
        i--
        blocks.push({ t: 'table', rows })
      } else if ((m = line.match(/^\s*#{1,6}\s+(.+)/))) {
        flush()
        blocks.push({ t: 'h', text: m[1] })
      } else if ((m = line.match(/^\s*(?:\*\*)?([A-Z])[.)](?:\*\*)?\s+(.+)/)) && (m[1] === 'A' ? /^\s*(?:\*\*)?B[.)]/.test(lines.slice(i + 1).find(l => l.trim()) ?? '')
        : !para.length && last?.t === 'choices' && m[1].charCodeAt(0) === 65 + last.items.length)) {
        flush()
        if (m[1] === 'A') blocks.push({ t: 'choices', items: [] })
        blocks.at(-1).items.push({ h: m[1], text: m[2] })
      } else if ((m = line.match(/^\s*[-*•]\s+(.+)/)) || (m = line.match(/^\s*\d+[.)]\s+(.+)/))) {
        flush()
        const t = /^\s*\d/.test(line) ? 'ol' : 'ul'
        if (last?.t === t && !para.length && !/^\s*$/.test(lines[i - 1] ?? 'x')) last.items.push(m[1])
        else blocks.push({ t, items: [m[1]] })
      } else if ((m = spokenChoices(line))) {
        if (m.intro) para.push(m.intro)
        flush()
        blocks.push({ t: 'choices', items: m.items })
      } else para.push(line)
    }
    flush()
    return blocks
  }

  // A reply's choices are buttons only when it asks something (rules.mjs asksSomething): "the B side passed" stays text.
  const asks = text => /\?|\b(say|pick|choose|tell me)\b/i.test(text)
  // A plain yes-or-no question as its last sentence gets Yes and No; "Ship it or wait?" doesn't.
  function yesNo(text) {
    const q = text.match(/([^.!?]*)\?\s*$/)?.[1] ?? ''
    return !/\bor\b/i.test(q) && /^\s*(?:\w+,\s*)?(?:should|shall|do|does|did|is|are|was|were|can|could|will|would|want|may|have|has)\b/i.test(q)
  }
  // format:end

  const make = (tag, ...kids) => {  // real nodes, never markup: these words come from speech and other sessions
    const el = document.createElement(tag)
    el.append(...kids)
    return el
  }
  const inline = text => text.split(/(`[^`\n]+`|\*\*[^*\n]+\*\*)/).filter(Boolean).map(part =>
    /^`.+`$/s.test(part) ? make('code', part.slice(1, -1)) : /^\*\*.+\*\*$/s.test(part) ? make('b', part.slice(2, -2)) : part)
  const RENDER = {
    p: b => make('p', ...inline(b.text)),
    h: b => make('h4', ...inline(b.text)),
    code: b => make('pre', b.text),
    ul: b => make('ul', ...b.items.map(i => make('li', ...inline(i)))),
    ol: b => make('ol', ...b.items.map(i => make('li', ...inline(i)))),
    choices: b => {
      const list = make('ul', ...b.items.map(i => make('li', make('b', `${i.h}.`), make('span', ...inline(i.text)))))
      list.className = 'choices'
      return list
    },
    table: b => make('table', ...b.rows.map((r, n) => make('tr', ...r.map(c => make(n ? 'td' : 'th', ...inline(c)))))),
  }

  function add(cls, text, at = Date.now(), raw = '', rich = false) {
    if (at - lastAt > GAP) {
      const t = document.createElement('div')
      t.className = 'time'
      t.textContent = new Date(at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
      chat.insertBefore(t, chat.contains(draft) ? draft : chat.contains(dots) ? dots : null)
    }
    lastAt = at
    const m = document.createElement('div')
    m.className = cls
    if (Array.isArray(rich)) m.append(...rich)
    else if (rich) m.append(...parse(text).map(b => RENDER[b.t](b)))
    else m.textContent = text
    if (raw && raw !== text) m.title = `Heard as: ${raw}`
    if (cls.startsWith('msg') && !cls.includes('hello')) {
      const text = m.innerText, b = document.createElement('button')
      Object.assign(b, { type: 'button', className: 'copy', textContent: 'Copy', title: 'Copy this message' })
      b.onclick = async () => { await navigator.clipboard.writeText(text).catch(() => {}); b.textContent = 'Copied'; setTimeout(() => (b.textContent = 'Copy'), 1200) }
      m.append(b)
    }
    chat.insertBefore(m, chat.contains(draft) ? draft : chat.contains(dots) ? dots : null)
    while (chat.children.length > 200) chat.firstChild.remove()
    follow()
  }

  // Clicking a choice answers as if it was said. Only the newest reply's buttons work: a click, an answer by voice or typed,
  // or a newer reply with choices retires them, and they stay in the chat as they were.
  let picks = []
  const retire = () => { for (const b of picks) b.disabled = true; picks = [] }
  async function choose(button, answer) {
    retire()
    button.classList.add('chosen')
    const r = await fetch('/choice', { method: 'POST', body: answer }).catch(() => null)
    if (!r?.ok) add('note fail', "Couldn't send that choice. Say it instead.")
  }
  function reply(e) {
    hide(dots)
    const options = (Array.isArray(e.options) ? e.options : []).map(String).filter(Boolean)
    const ask = !options.length && asks(e.text), buttons = []
    const button = (answer, ...kids) => {
      const b = make('button', ...kids)
      b.type = 'button'
      b.className = 'pick'
      b.onclick = () => choose(b, answer)
      buttons.push(b)
      return b
    }
    const list = items => {
      const l = make('ul', ...items.map(([h, text]) => make('li', button(h, make('b', `${h}.`), make('span', ...inline(text))))))
      l.className = 'choices'
      return l
    }
    const nodes = parse(e.text).map(b => !ask ? RENDER[b.t](b) : b.t === 'choices' ? list(b.items.map(i => [i.h, i.text]))
      : b.t === 'ol' ? list(b.items.map((t, n) => [String(n + 1), t])) : RENDER[b.t](b))
    const row = options.length ? options : ask && !buttons.length && yesNo(e.text) ? ['Yes', 'No'] : []
    if (row.length) {
      const r = make('div', ...row.map(o => button(o, o)))
      r.className = 'picks'
      nodes.push(r)
    }
    add('msg me', e.text, e.at, '', nodes)
    if (buttons.length) (retire(), picks = buttons)
  }

  // Story mode: each part joins the chat once heard, the part being said shows live below it, and the header counts.
  let storyAt = 0, storyWords = 0, storyTimer = 0
  function storyTick() {
    if (!storyAt) return clearInterval(storyTimer)
    const s = Math.max(0, Math.round((Date.now() - storyAt) / 1000))
    state('listen', 'Story mode', `${storyWords} words, ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`)
  }
  function storyOver(note, at) {
    storyAt = 0
    clearInterval(storyTimer)
    hide(draft)
    add('note', note, at)
    rest()
  }

  const HANDLERS = {
    story_on: e => {
      [storyAt, storyWords] = [e.at, 0]
      add('note', 'Story mode: each part shows here as it is heard. Say "end story" when you are done.', e.at)
      listening()
      clearInterval(storyTimer)
      storyTimer = setInterval(storyTick, 1000)
      storyTick()
    },
    story_part: e => {
      storyWords = e.words
      add('msg you', e.text, e.at)
      if (storyAt) (listening(), storyTick())  // the live words start over for the next part
    },
    story: e => storyOver(`Story sent to Jarvis: ${e.words} words, ${e.minutes} min.`, e.at),
    story_cancelled: e => storyOver('Story cancelled: nothing sent, the file is kept.', e.at),
    story_empty: e => storyOver('Story mode off: nothing was heard.', e.at),
    state: e => {
      on = e.on
      rest()
      micName = e.mic || ''
      hearing()
    },
    wake: () => { hide(dots); listening(); state('listen', 'Listening') },
    greeting: e => add('msg me hello', e.text, e.at),
    out: e => { outLvl = e.v; outAt = Date.now() },
    level: e => { lvl = Math.max(lvl, e.v); lastIn = Date.now(); if (e.v > .3) heardAt = lastIn; paint(); hearing() },
    reminder: e => add('msg me', e.text, e.at, '', true),
    partial: e => liveWords(e.text),
    heard: e => {
      retire()
      hide(draft)
      add('msg you', e.text, e.at, e.raw)
      show(dots)
      state('work', 'Thinking')
    },
    nothing: () => { hide(draft); hide(dots); rest('Heard no request') },
    route: e => $('detail').textContent = `${e.kind}, ${e.ms} ms`,
    sent: e => {
      retire()
      if (e.via !== 'mic' && e.via !== 'story') add('msg you', e.text, e.at)  // a story's parts are in the chat already
      show(dots)
      state('work', 'Claude is working')
    },
    reply: e => { firstOver(); reply(e) },
    again: e => { hide(draft); add('msg you', e.text, e.at); reply({ text: e.line, at: e.at }) },
    said: () => state('speak', 'Speaking'),
    spoken: e => {
      if (e.listening) {
        listening()
        state('listen', 'Listening for your answer')
      } else rest()
    },
    held: e => add('note', `Held for after your call: ${e.text}`, e.at),
    queued: () => $('detail').textContent = 'Line waiting',
    peak: e => { if (e.score < 0.5) $('detail').textContent = `Last try ${e.score}` },
    status: e => { if (/^Voice:|^Using |now on /.test(e.text)) add('note', e.text, e.at) },
    caption: e => {
      if (!e.looking) return add('note', e.text, e.at)
      const cut = e.text.indexOf('. ') + 1  // "Hello, I'm Jarvis, and I can hear you." then the help
      for (const t of cut ? [e.text.slice(0, cut), e.text.slice(cut).trim()] : [e.text]) add('msg me', t, e.at)
    },
    quiet: e => $('quiet').textContent = e.on ? `Staying quiet: ${e.text}` : '',
    error: e => add('note fail', e.message, e.at),
  }

  // Settings: every change is saved and applied by the voice at once.
  async function saveSetting(key, value) {
    const r = await fetch('/settings', { method: 'POST', body: JSON.stringify({ key, value }) }).catch(() => null)
    $('saved').textContent = r?.ok ? 'Saved' : "Couldn't save that."
    if (r?.ok && key === 'MIC_DEVICE') loadMics()
    return r?.ok
  }
  async function openSettings() {
    const list = (await (await fetch('/settings')).json()).filter(s => s.key !== 'MIC_DEVICE')
    $('rows').firstChild.replaceChildren(...list.map(s => {
      const row = document.createElement('label'), words = document.createElement('span')
      const name = document.createElement('b')
      const input = document.createElement(s.device ? 'select' : 'input')
      row.className = 'set'
      name.textContent = s.label
      words.append(name)
      if (s.device) {  // '' is Windows default; a saved device that's unplugged stays listed, so the pick shows
        const [names, value] = deviceList(s)
        input.append(...['', ...names].map(n => new Option(n || 'Windows default', n)))
        input.value = value
        input.onchange = () => saveSetting(s.key, input.value)
      } else if (s.options) {
        input.type = 'checkbox'
        input.checked = s.value === s.options[0]
        input.onchange = async () => {
          if (!await saveSetting(s.key, input.checked ? s.options[0] : s.options[1])) input.checked = !input.checked
        }
      } else if (s.text) {
        Object.assign(input, { type: 'text', value: s.value, maxLength: 40 })
        input.onchange = () => saveSetting(s.key, input.value.trim())
      } else {
        input.type = 'number'
        Object.assign(input, { min: s.min, max: s.max, value: s.value })
        input.onchange = () => saveSetting(s.key, input.value)
      }
      row.append(words, input)
      return row
    }))
    $('saved').textContent = ''
  }
  // .env may hold part of a name (MIC_DEVICE=Shokz): the first device containing it is the one in use
  function deviceList(s) {
    const value = s.value && (s.choices.find(c => c.toLowerCase().includes(s.value.toLowerCase())) ?? s.value)
    return [value && !s.choices.includes(value) ? [...s.choices, value] : s.choices, value]
  }
  async function sheet(open) {
    if (open) await openSettings()
    document.body.classList.toggle('sheet', open)
    $('panel').inert = !open
    $('gear').setAttribute('aria-expanded', open)
    if (open) $('done').focus({ preventScroll: true }); else $('gear').focus({ preventScroll: true })
  }
  $('gear').onclick = () => sheet(true)
  $('done').onclick = $('scrim').onclick = () => sheet(false)
  addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('sheet')) sheet(false) })

  // The orb's look: Finish, Colors and Grain behind one button, each change shown at once.
  const FINISHES = ['ink', 'pearl', 'vessel', 'aurora', 'plasma']
  function lookPanel() {
    if (!orb) return
    const cur = orb.look(), mark = () => {
      for (const b of document.querySelectorAll('#finishes .chip')) b.setAttribute('aria-pressed', b.dataset.v === orb.look().finish)
      for (const b of document.querySelectorAll('#palettes .sw')) b.setAttribute('aria-pressed', b.dataset.v === orb.look().palette)
    }
    $('finishes').replaceChildren(...FINISHES.map(f => {
      const b = make('button', f[0].toUpperCase() + f.slice(1))
      Object.assign(b, { type: 'button', className: 'chip' })
      b.dataset.v = f
      b.onclick = () => { orb.change({ finish: f }); mark() }
      return b
    }))
    $('palettes').replaceChildren(...Object.keys(orb.palettes).map(n => {
      const b = make('button'), stops = orb.palettes[n][orb.field()].stops
      Object.assign(b, { type: 'button', className: 'sw', title: n[0].toUpperCase() + n.slice(1) })
      b.setAttribute('aria-label', b.title)
      b.style.background = `linear-gradient(135deg, ${stops.join(', ')})`
      b.dataset.v = n
      b.onclick = () => { orb.change({ palette: n }); mark() }
      return b
    }))
    $('grain').value = cur.grain
    $('grain').oninput = () => orb.change({ grain: +$('grain').value })
    mark()
    $('look').hidden = false
  }
  const looks = open => {
    $('looks').hidden = !open
    $('look').setAttribute('aria-expanded', open)
  }
  $('look').onclick = e => { e.stopPropagation(); looks($('looks').hidden) }
  document.addEventListener('click', e => { if (!$('looks').hidden && !$('looks').contains(e.target)) looks(false) })
  addEventListener('keydown', e => { if (e.key === 'Escape') looks(false) })
  lookPanel()
  // The pill's controls: the microphone and the orb's style, nothing that sends anything.
  if (orb) {
    $('pillmic').onclick = async () => {
      const want = !on
      await fetch('/mic', { method: 'POST', body: want ? 'on' : 'off' }).catch(() => {})
    }
    $('pillstop').onclick = () => fetch('/stop', { method: 'POST', body: 'stop' }).catch(() => {})
    $('pilllook').onclick = e => { e.stopPropagation(); orb.pill.open(false); looks(true) }
    setInterval(() => {
      $('pillmic').textContent = on ? 'Mic on' : 'Mic off'
      $('pillmic').setAttribute('aria-pressed', on)
    }, 200)
  }

  // The dock: pick the microphone, and see it hear you. The listener sends a level about ten times a second while this
  // window is open and Jarvis is waiting for its name; the bar and the orb follow it, and a silent mic says so.
  const meter = $('meter'), SEG = 14
  meter.append(...Array.from({ length: SEG }, () => document.createElement('i')))
  let micName = '', lastIn = 0, heardAt = 0, openedAt = Date.now()
  function paint() {
    const n = Math.round(lvl * SEG)
    ;[...meter.children].forEach((s, i) => s.classList.toggle('on', i < n))
    meter.setAttribute('aria-valuenow', lvl.toFixed(2))
    meter.classList.toggle('off', !on)
    $('micbtn').setAttribute('aria-pressed', on)
    $('micbtn').title = on ? 'Mute microphone (Ctrl+M)' : 'Unmute microphone (Ctrl+M)'
  }
  function hearing() {
    const el = $('hear'), now = Date.now(), live = now - lastIn < 1500
    let text = '', cls = ''
    if (!on) text = 'Mic off'
    else if (!live) text = body.dataset.mood === 'idle' ? '' : 'In use'
    else if (now - heardAt < 1200) [text, cls] = ['Hearing you', 'ok']
    else if (now - Math.max(heardAt, openedAt) > 8000) [text, cls] = ['No sound: check mute', 'warn']
    else text = 'Say something'
    el.textContent = text
    el.className = cls
  }
  const setMic = want => fetch('/mic', { method: 'POST', body: want ? 'on' : 'off' }).catch(() => {})
  $('micbtn').onclick = () => setMic(!on)
  addEventListener('keydown', e => {
    if (e.ctrlKey && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'm') { e.preventDefault(); setMic(!on) }
    else if (e.key === 'Escape' && !body.classList.contains('sheet') && $('looks').hidden && body.dataset.mood === 'speak') fetch('/stop', { method: 'POST', body: 'stop' }).catch(() => {})
  })
  setInterval(() => { lvl = lvl < .04 ? 0 : lvl * .72; paint(); hearing() }, 100)
  async function loadMics() {
    const s = (await (await fetch('/settings')).json().catch(() => [])).find(x => x.key === 'MIC_DEVICE')
    if (!s) return
    const [names, value] = deviceList(s), pick = $('micpick')
    pick.replaceChildren(...['', ...names].map(n => new Option(n || 'Windows default', n)))
    pick.value = value
  }
  $('micpick').onchange = async () => {
    heardAt = 0; openedAt = Date.now()
    $('hear').textContent = 'Switching'
    if (!await saveSetting('MIC_DEVICE', $('micpick').value)) $('hear').textContent = "Couldn't switch"
  }

  // First run: a card with one button, until setup is started or skipped. It is the user pressing it that sends the
  // first message: at startup Claude Code may still be on its trust prompts, and a message sent then is lost.
  let firstTimer = 0
  function firstCard(title, bodyText, button) {
    document.body.classList.add('first')
    $('first').hidden = false
    $('firsttitle').textContent = title
    $('firstbody').textContent = bodyText
    $('start').textContent = button
    $('start').disabled = false
    $('skip').hidden = false
  }
  function firstOver() {
    clearTimeout(firstTimer)
    document.body.classList.remove('first')
    $('first').hidden = true
  }
  async function checkFirst() {
    const todo = await fetch('/onboard').then(r => r.text()).catch(() => 'done') === 'todo'
    if (!todo) return firstOver()
    firstCard('Set up Jarvis', '', 'Start setup')
  }
  $('start').onclick = async () => {
    $('start').disabled = true
    $('start').textContent = 'Starting'
    clearTimeout(firstTimer)
    const r = await fetch('/onboard', { method: 'POST', body: 'start' }).catch(() => null)
    if (!r?.ok) return firstCard("Couldn't start", '', 'Try again')
    $('firsttitle').textContent = 'Jarvis is starting'
    $('firstbody').textContent = ''
    $('skip').hidden = true
    // Claude Code takes a while to wake up the first time; with nothing by then, offer another go.
    firstTimer = setTimeout(() => firstCard('Nothing yet', '', 'Start again'), 30_000)
  }
  $('skip').onclick = async () => {
    await fetch('/onboard', { method: 'POST', body: 'skip' }).catch(() => null)
    firstOver()
  }

  const source = new EventSource('/events')
  source.onopen = () => { chat.replaceChildren(); lastAt = 0; stuck = true; newest.hidden = true; newest.classList.remove('fresh'); rest(); loadMics(); checkFirst() }  // the server replays what happened
  source.onerror = () => { state('bad', 'Jarvis is off', 'Reconnecting'); $('quiet').textContent = ''; lvl = 0; paint(); hearing(); hide(draft); hide(dots) }
  source.onmessage = m => {
    const e = JSON.parse(m.data)
    HANDLERS[e.event]?.(e)
  }
</script>
</body>
</html>
